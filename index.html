<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- 태블릿에서 "홈 화면에 추가" 하면 주소창 없이 꽉 찬 화면으로 열린다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="쇼크 히어로" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#140b1f" />
    <!-- 안드로이드에서 홈 화면에 추가하면 가로로 고정되고 아이콘이 생긴다 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <!-- 타이틀 화면 붓글씨 글꼴. 못 받아도 기본 글꼴로 돈다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
    <title>쇼크 히어로: 몬스터 브레이커</title>
    <style>
      html, body { margin: 0; height: 100%; background: #140b1f; overflow: hidden; }
      /* 태블릿: 버튼을 누르다가 화면이 확대되거나 글자가 선택되거나 길게 누름 메뉴가 뜨지 않게 */
      html, body, #game { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* 휴대폰 노치, 둥근 모서리, 아래 홈 막대에 게임이 가리지 않게 안쪽으로 */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      /* 휴대폰을 세로로 들면 게임이 너무 작아서 돌려 달라고 한다 (태블릿은 세로도 할 만해서 그대로) */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 599px) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          background: #140b1f; color: #ffffff; font: bold 22px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; line-height: 1.5;
        }
        #rotate .phone { width: 46px; height: 80px; border: 5px solid #ffd23f; border-radius: 10px; animation: turn 1.8s ease-in-out infinite; }
        #rotate small { font-size: 16px; font-weight: normal; color: #cccccc; }
      }
      @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>휴대폰을 가로로 돌려 주세요<small>가로 화면에서 더 크게 보여요</small></div>
    <script type="module" src="/src/main.js"></script>
    <!-- 방문 통계 (https://shockhero.goatcounter.com). 쿠키를 쓰지 않고, 자기 컴퓨터(localhost)에서는 세지 않는다. 게임 안 사건은 src/net/stats.js -->
    <script data-goatcounter="https://shockhero.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
